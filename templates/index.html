<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wine Quality Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>🍷 Wine Quality Predictor</h1>
    <p class="sub">Enter the wine's chemical properties to predict its quality.</p>

    <form id="wine-form" novalidate>
      <div class="grid">
        {% for f in features %}
        <label>
          <span>{{ f|title }}</span>
          <input type="number" step="any" name="{{ f }}" required>
        </label>
        {% endfor %}
      </div>
      <div class="actions">
        <button type="submit" id="submit-btn">Predict quality</button>
        <button type="button" id="sample-btn" class="secondary">Fill sample</button>
      </div>
    </form>

    <div id="result" class="result hidden" aria-live="polite"></div>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
